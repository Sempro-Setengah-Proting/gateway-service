services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GATEWAY_PORT: "8080"
      IDENTITY_SERVICE_URL: "${IDENTITY_DOCKER_SERVICE_URL:-http://host.docker.internal:8081}"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
